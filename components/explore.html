<section class="explore" id="explore">
    <div class="floating-search-wrapper" id="floating-search">
        <div class="search-bar glass-search">
            <div class="search-item">
                <label for="search-1">Where</label>
                <input id="search-1" type="text" placeholder="Anywhere"/>
            </div>

            <div class="search-item search-item-date" id="searchDateItem">
                <label for="search-2">When</label>
                <div class="dr-trigger" id="drTrigger">
                    <span class="dr-placeholder" id="drPlaceholder">Anytime</span>
                    <span class="dr-value" id="drValue">dd/mm - dd/mm</span>
                    <span class="dr-chevron">▾</span>
                </div>
                <div class="dr-dropdown" id="drDropdown">
                    <div class="dr-cal-header">
                        <button class="dr-nav" id="drPrev">‹</button>
                        <span class="dr-month-label" id="drMonthLabel">Month Year</span>
                        <button class="dr-nav" id="drNext">›</button>
                    </div>
                    <div class="dr-cal-grid" id="drCalGrid"></div>
                    <div class="dr-cal-footer">
                        <button class="dr-clear" id="drClear">Clear</button>
                        <button class="dr-close" id="drClose">Close</button>
                    </div>
                </div>
            </div>

            <div class="search-item">
                <label for="search-3">Preferences</label>
                <input id="search-3" type="text" placeholder="Anything you'd like"/>
            </div>

            <button class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </button>
        </div>
    </div>

    <div id="cards-container" class="cards-container">

    </div>
</section>
