<div class="chatbot-widget" id="chatbot-widget">
  <div class="chatbot-panel" id="chatbot-panel">
    <!-- Header -->
    <div class="chatbot-header">
      <div class="chatbot-header-info">
        <div class="chatbot-header-text">
          <div class="chatbot-title">
            <span data-i18n="chatbot.title">SpringWave Assistant</span>
            <span class="chatbot-badge">AI AGENT</span>
          </div>
          <div class="chatbot-status">
            <span class="status-dot"></span>
            <span data-i18n="chatbot.online">Trực tuyến</span>
          </div>
        </div>
      </div>
      <div class="chatbot-header-actions">
        <button class="chatbot-action-btn" id="chatbot-clear" title="Xóa lịch sử chat">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button class="chatbot-action-btn" id="chatbot-close" title="Đóng">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="chatbot-messages" id="chatbot-messages">
      <!-- Loading Skeleton (Shown when fetching history) -->
      <div class="chatbot-skeleton hidden" id="chatbot-skeleton">
        <div class="skeleton-bubble bot"></div>
        <div class="skeleton-bubble user"></div>
        <div class="skeleton-bubble bot short"></div>
      </div>

      <div class="message bot">
        <div class="message-content" data-i18n="chatbot.greeting">
          Xin chào! Tôi là Trợ lý AI Tự Hành SpringWave. Bạn cần tìm kiếm sự kiện, đăng ký vé, hay quản lý hoạt động gì hôm nay?
        </div>
      </div>
    </div>

    <!-- Suggestion Chips -->
    <div class="chatbot-suggestions" id="chatbot-suggestions">
      <button class="chip-btn" data-suggest="Sắp tới có sự kiện nào hot không?">
        <i class="fa-solid fa-fire text-amber-500"></i> Sự kiện sắp tới
      </button>
      <button class="chip-btn" data-suggest="Cho mình xem vé đã đăng ký">
        <i class="fa-solid fa-ticket text-blue-500"></i> Vé của tôi
      </button>
      <button class="chip-btn" data-suggest="Xem thống kê hoạt động của mình">
        <i class="fa-solid fa-chart-pie text-emerald-500"></i> Thống kê
      </button>
      <button class="chip-btn" data-suggest="Cộng đồng thảo luận có gì mới?">
        <i class="fa-solid fa-comments text-indigo-500"></i> Thảo luận
      </button>
    </div>

    <!-- Input Bar -->
    <div class="chatbot-input-area">
      <div class="chatbot-input-wrapper">
        <input type="text" class="chatbot-input" id="chatbot-input" data-i18n-placeholder="chatbot.input_placeholder" placeholder="Nhập tin nhắn (VD: Đăng ký sự kiện, xem vé...)" autocomplete="off" />
        <button class="chatbot-send" id="chatbot-send" title="Gửi tin nhắn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- QR Code Modal (Embedded in Chatbot) -->
  <div class="chatbot-qr-modal hidden" id="chatbot-qr-modal">
    <div class="chatbot-qr-backdrop" id="chatbot-qr-backdrop"></div>
    <div class="chatbot-qr-content">
      <div class="chatbot-qr-header">
        <div class="chatbot-qr-title">
          <i class="fa-solid fa-qrcode text-blue-600"></i>
          <span>Mã QR Check-in</span>
        </div>
        <button class="chatbot-qr-close" id="chatbot-qr-close" type="button" title="Đóng">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="chatbot-qr-body">
        <h4 class="chatbot-qr-event-name" id="chatbot-qr-event-name">Tên sự kiện</h4>
        <div class="chatbot-qr-img-wrapper">
          <img src="" alt="QR Code Check-in" id="chatbot-qr-image" class="chatbot-qr-img" />
        </div>
        <div class="chatbot-qr-code-text" id="chatbot-qr-code-text">Mã vé: #------</div>
        <p class="chatbot-qr-hint">Xuất trình mã này tại bàn tiếp đón của sự kiện để điểm danh nhanh chóng.</p>
        <button type="button" class="chatbot-qr-download-btn" id="chatbot-qr-download-btn">
          <i class="fa-solid fa-download"></i> Tải ảnh QR Code
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Trigger Bubble -->
  <div class="chatbot-bubble" id="chatbot-bubble" title="Mở Trợ lý SpringWave AI">
    <i class="fa-solid fa-robot chatbot-bubble-icon"></i>
    <span class="chatbot-bubble-online-badge"></span>
  </div>
</div>
