<div class="chatbot-widget" id="chatbot-widget">
  <div class="chatbot-panel" id="chatbot-panel">
    <div class="chatbot-header">
      <div class="chatbot-header-info">
        <div class="chatbot-avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div>
          <div class="chatbot-title" data-i18n="chatbot.title">SpringWave Assistant</div>
          <div class="chatbot-status" data-i18n="chatbot.online">Online</div>
        </div>
      </div>
      <button class="chatbot-close" id="chatbot-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="chatbot-messages" id="chatbot-messages">
      <div class="message bot">
        <div class="message-content" data-i18n="chatbot.greeting">
          Hello! I'm SpringWave Assistant. How can I help you?
        </div>
      </div>
    </div>
    <div class="chatbot-input-area">
      <input type="text" class="chatbot-input" id="chatbot-input" data-i18n="chatbot.input_placeholder" placeholder="Type a message..." autocomplete="off" />
      <button class="chatbot-send" id="chatbot-send">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>
  <div class="chatbot-bubble" id="chatbot-bubble">
    <i class="fa-regular fa-comment-dots"></i>
  </div>
</div>
