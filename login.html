<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringWave - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

    <style>
        .error-msg { @apply text-red-500; }
        .success-msg { @apply text-green-500; }
    </style>
</head>

<body class="min-h-screen overflow-hidden bg-cover flex justify-center items-center p-10 max-sm:p-5"
      style="background-image: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('assets/images/danang-17042710410701744932512.jpeg'); backdrop-filter: blur(3px);">

    <div class="w-[70%] max-w-[600px] bg-white/90 backdrop-blur-sm rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.12)] p-9 max-sm:w-full max-sm:p-6 max-sm:rounded-2xl">

        <a href="index.html" class="inline-block mb-6 transition duration-200 hover:-translate-y-1">
            <div class="inline-flex items-center gap-2 text-[17px] font-semibold text-[#23499b] transition duration-200 hover:text-[#183a82]">
                <i class="bi bi-house-door text-[24px]"></i>
                Home
            </div>
        </a>

        <h1 class="text-[42px] max-sm:text-[30px] font-bold text-[#23499b] text-center mb-10 max-sm:mb-6">JOIN SPRINGWAVE!</h1>

        <form id="login-form">
            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-xl">
                    Username <span class="text-red-500">*</span>
                </label>
                <input id="username" type="text" placeholder="Albert_Epstein" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-lg bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:p-[10px_12px] max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-xl">
                    Password <span class="text-red-500">*</span>
                </label>
                <input id="password" type="password" placeholder="Enter password" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-lg bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:p-[10px_12px] max-sm:text-base">
            </div>

            <div id="status-msg" class="text-sm my-2"></div>

            <button type="submit"
                    class="w-full p-4 bg-[#ffde42] border-2 border-[#23499b] rounded-2xl text-xl font-bold cursor-pointer mt-2.5 transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_8px_18px_rgba(255,222,66,0.4)] max-sm:p-3.5 max-sm:text-lg">
                LOGIN
            </button>

            <div class="mt-4 text-center text-[17px] text-[#333]">
                Don't have an account?
                <a href="register.html" class="text-[#23499b] font-bold no-underline"><u>Register now</u></a>
            </div>
        </form>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>

</html>
