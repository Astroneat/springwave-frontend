<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringWave - Login</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components/login.css">
</head>

<body>

    <div class="frame-1">

        <h1 class="join-title">JOIN SPRINGWAVE!</h1>

        <form id="login-form">

            <!-- USERNAME -->
            <div class="form-group">
                <label style="font-size: 20px;">
                    Username <span class="required">*</span>
                </label>

                <input id="username" type="text" placeholder="Albert_Epstein" required>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label style="font-size: 20px;">
                    Password <span class="required">*</span>
                </label>

                <input id="password" type="password" placeholder="Enter password" required>
            </div>

            <div id="status-msg" class="status-msg">
                <!-- aaa -->
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" class="login-btn">
                LOGIN
            </button>

            <!-- LOGIN -->
            <div class="login-text">
                Don't have an account?
                <a href="register.html"><u>Register now</u></a>
            </div>

        </form>

    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>

</html>
