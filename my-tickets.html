<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets - SpringWave</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body class="bg-background font-body-md">
  <div id="navbar-container"></div>

  <div class="relative z-10 max-w-5xl mx-auto px-4 pt-24 pb-8">
    <div class="flex items-center gap-3 mb-8">
      <span class="w-10 h-10 rounded-xl bg-[#ecedfa] flex items-center justify-center text-[#1755ba]">
        <span class="material-symbols-outlined">confirmation_number</span>
      </span>
      <div>
        <h1 class="text-2xl font-bold text-[#191b22]">My Tickets</h1>
        <p class="text-sm text-[#64748b]">Your registered events and QR codes</p>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 hidden" id="filter-bar">
      <div class="flex items-center gap-2">
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/50" id="active-count-badge">
          0 Active
        </span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200/50" id="expired-count-badge">
          0 Expired
        </span>
      </div>
      <button id="toggle-expired-btn" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 active:scale-[0.98] text-sm font-semibold text-slate-700 transition-all shadow-sm cursor-pointer">
        <span class="material-symbols-outlined text-lg" id="toggle-expired-icon">visibility</span>
        <span id="toggle-expired-text">Show Expired Tickets</span>
      </button>
    </div>

    <div id="tickets-list" class="space-y-4">
      <div class="text-center py-12 text-[#64748b]">Loading...</div>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qr-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl scale-95 transition-transform duration-300 relative" id="qr-modal-content">
      <button id="close-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="text-center mt-2">
        <h4 id="modal-event-title" class="font-bold text-lg text-slate-900 mb-2 truncate">Event Title</h4>
        <div class="inline-block p-3 bg-slate-50 border border-slate-100 rounded-2xl mb-4">
          <img id="modal-qr-img" src="" alt="Ticket QR Code" class="w-56 h-56 mx-auto rounded-xl shadow-inner bg-white" />
        </div>
        <p class="text-xs text-slate-500 font-mono mb-4" id="modal-qr-code">CODE</p>
        <a id="modal-download-btn" href="" download="" target="_blank" class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-[#1755ba] hover:bg-[#1755ba]/90 text-white font-semibold text-sm shadow-md transition-all">
          <span class="material-symbols-outlined text-[18px]">download</span> Download Ticket QR
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/my-tickets.js"></script>
</body>
</html>
