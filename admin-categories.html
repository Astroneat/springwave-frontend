<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="admin_categories.title">Category Management — SpringWave Admin</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script>
    (function(){
        try {
            var _u = JSON.parse(localStorage.getItem("user") || "null");
            if (!_u || _u.role !== "admin") { window.location.replace("/login.html"); }
        } catch(e) { window.location.replace("/login.html"); }
    })();
    </script>
    <style>
        .tab-btn { padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .tab-btn:active { transform: scale(0.95); }
        .tab-btn.active { background: #1755ba; color: #fff; box-shadow: 0 4px 12px rgba(23,85,186,0.2); }
        .tab-btn:not(.active) { background: transparent; color: #64748b; }
        .tab-btn:not(.active):hover { background: #f1f5f9; }
        .color-preview { width: 24px; height: 24px; border-radius: 6px; display: inline-block; border: 1px solid #e2e2eb; }
    </style>
</head>
<body class="bg-[#faf8ff] text-[#191b22] font-body-md antialiased min-h-screen">
    <div id="navbar-container"></div>

    <main class="pt-[120px] max-w-[1280px] mx-auto px-6 md:px-10 pb-16">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
            <div>
                <h1 class="font-headline-lg text-[32px] md:text-[40px] font-extrabold text-[#191b22]" data-i18n="admin_categories.title">Category Management</h1>
                <p class="text-[#64748b] text-base mt-1" data-i18n="admin_categories.desc">Manage activity categories</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-[#94a3b8] text-sm"></i>
                    <input type="text" id="search-input" placeholder="Search categories..." class="pl-10 pr-4 py-2.5 rounded-full border border-[#e2e2eb] bg-white text-sm w-[200px] outline-none focus:border-primary transition-colors" />
                </div>
                <button id="refresh-btn" class="w-10 h-10 rounded-full border border-[#e2e2eb] bg-white flex items-center justify-center text-[#64748b] hover:bg-[#f1f5f9] transition-all spring-ease" title="Refresh">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button id="add-category-btn" class="py-2.5 px-5 rounded-full bg-primary text-white text-sm font-semibold flex items-center gap-2 border-none cursor-pointer spring-ease hover:bg-primary/90 active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span data-i18n="admin_categories.add">Add Category</span>
                </button>
            </div>
        </div>

        <div class="flex gap-3 mb-6">
            <a href="/admin.html" class="px-5 py-2.5 rounded-xl text-sm font-semibold border-none cursor-pointer spring-ease active:scale-95 bg-transparent text-[#64748b] hover:bg-[#f1f5f9]">
                <i class="fa-solid fa-calendar-days mr-1.5"></i> Events
            </a>
            <a href="/admin-host.html" class="px-5 py-2.5 rounded-xl text-sm font-semibold border-none cursor-pointer spring-ease active:scale-95 bg-transparent text-[#64748b] hover:bg-[#f1f5f9]">
                <i class="fa-solid fa-users-gear mr-1.5"></i> Host Registrations
            </a>
            <a href="/admin-student-verification.html" class="px-5 py-2.5 rounded-xl text-sm font-semibold border-none cursor-pointer spring-ease active:scale-95 bg-transparent text-[#64748b] hover:bg-[#f1f5f9]">
                <i class="fa-solid fa-graduation-cap mr-1.5"></i> Student Verification
            </a>
            <a href="/admin-categories.html" class="px-5 py-2.5 rounded-xl text-sm font-semibold border-none cursor-pointer spring-ease active:scale-95 bg-primary text-white shadow-md">
                <i class="fa-solid fa-tags mr-1.5"></i> Categories
            </a>
        </div>

        <div class="bg-white rounded-[24px] border border-[#ecedfa] shadow-sm overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-[#ecedfa]">
                <h2 class="font-headline-md text-xl font-bold text-[#191b22]" data-i18n="admin_categories.list">Categories</h2>
                <span class="text-sm text-[#64748b] font-medium" id="table-count">0 categories</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-[#ecedfa] bg-[#f8f9fc]">
                            <th class="text-left py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide">Icon</th>
                            <th class="text-left py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide">Name</th>
                            <th class="text-left py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide hidden sm:table-cell">Slug</th>
                            <th class="text-left py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide hidden md:table-cell">Color</th>
                            <th class="text-left py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide hidden lg:table-cell">Sort</th>
                            <th class="text-left py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide">Status</th>
                            <th class="text-right py-3.5 px-4 font-semibold text-[#64748b] text-[13px] uppercase tracking-wide">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div id="table-empty" class="hidden text-center py-16 text-[#94a3b8]">
                <i class="fa-solid fa-tags text-4xl mb-3 block"></i>
                <p class="text-base font-semibold" data-i18n="admin_categories.no_categories">No categories found</p>
            </div>
        </div>
    </main>

    <!-- CREATE / EDIT POPUP -->
    <div class="popup-overlay" hidden id="form-overlay">
        <div class="popup-backdrop" id="form-backdrop"></div>
        <div class="popup-container !max-w-[520px] !p-8">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-[#191b22]" id="form-title" data-i18n="admin_categories.add_category">Add Category</h3>
                <button class="w-9 h-9 rounded-lg border border-[#e2e2eb] bg-white flex items-center justify-center text-[#64748b] hover:bg-[#f8f9fc] spring-ease" id="form-close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-[13px] font-semibold text-[#64748b] mb-1.5">Name *</label>
                    <input id="field-name" type="text" class="w-full px-4 py-2.5 rounded-xl border border-[#e2e2eb] bg-white text-sm text-[#191b22]" placeholder="e.g. Workshop" />
                </div>
                <div>
                    <label class="block text-[13px] font-semibold text-[#64748b] mb-1.5">Icon (FontAwesome class)</label>
                    <input id="field-icon" type="text" class="w-full px-4 py-2.5 rounded-xl border border-[#e2e2eb] bg-white text-sm text-[#191b22]" placeholder="e.g. fa-solid fa-screwdriver-wrench" />
                </div>
                <div>
                    <label class="block text-[13px] font-semibold text-[#64748b] mb-1.5">Color</label>
                    <div class="flex items-center gap-3">
                        <input id="field-color" type="color" class="w-10 h-10 rounded-lg border border-[#e2e2eb] cursor-pointer p-0.5" value="#10b981" />
                        <input id="field-color-text" type="text" class="flex-1 px-4 py-2.5 rounded-xl border border-[#e2e2eb] bg-white text-sm text-[#191b22]" placeholder="#10b981" value="#10b981" />
                    </div>
                </div>
                <div>
                    <label class="block text-[13px] font-semibold text-[#64748b] mb-1.5">Sort Order</label>
                    <input id="field-sort" type="number" class="w-full px-4 py-2.5 rounded-xl border border-[#e2e2eb] bg-white text-sm text-[#191b22]" value="0" />
                </div>
                <div class="flex items-center gap-2">
                    <input id="field-active" type="checkbox" class="w-4 h-4 rounded border-[#c3c6d5] text-primary cursor-pointer accent-primary" checked />
                    <label for="field-active" class="text-sm font-medium text-[#191b22]">Active</label>
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button class="flex-1 py-3 rounded-xl border border-[#e2e2eb] bg-white text-[#64748b] font-semibold text-sm spring-ease hover:bg-[#f8f9fc] active:scale-95" id="form-cancel" data-i18n="common.cancel">Cancel</button>
                <button class="flex-1 py-3 rounded-xl border-none bg-primary text-white font-semibold text-sm spring-ease hover:bg-primary/90 active:scale-95" id="form-save" data-i18n="common.save">Save</button>
            </div>
        </div>
    </div>

    <!-- DELETE CONFIRMATION POPUP -->
    <div class="popup-overlay" hidden id="delete-overlay">
        <div class="popup-backdrop" id="delete-backdrop"></div>
        <div class="popup-container !max-w-[420px] !p-8 text-center">
            <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-trash-can text-red-500 text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-[#191b22] mb-2" data-i18n="admin_categories.delete_title">Delete Category</h3>
            <p class="text-sm text-[#64748b] mb-6">Delete <strong id="delete-name">this category</strong>? This cannot be undone if no events use it.</p>
            <div class="flex gap-3">
                <button class="flex-1 py-3 rounded-xl border border-[#e2e2eb] bg-white text-[#64748b] font-semibold text-sm spring-ease hover:bg-[#f8f9fc] active:scale-95" id="delete-cancel" data-i18n="common.cancel">Cancel</button>
                <button class="flex-1 py-3 rounded-xl border-none bg-red-500 text-white font-semibold text-sm spring-ease hover:bg-red-600 active:scale-95" id="delete-confirm" data-i18n="common.delete">
                    <i class="fa-solid fa-trash-can mr-1.5"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>
    <div id="chatbot-container"></div>

    <script type="module" src="./js/pages/admin-categories.js"></script>
</body>
</html>
