<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringWave - Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/components/chatbot.css">
    <style>
        .error-msg { @apply text-red-500; }
        .success-msg { @apply text-green-500; }
    </style>
</head>

<body class="min-h-screen bg-cover flex justify-center items-center p-10 max-sm:p-5"
      style="background-image: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), url('assets/images/danang-17042710410701744932512.jpeg'); backdrop-filter: blur(3px);">

    <div class="w-[70%] max-w-[600px] bg-white/90 backdrop-blur-sm rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.12)] p-9 max-sm:w-full max-sm:p-6 max-sm:rounded-2xl">

        <h1 class="text-[42px] max-sm:text-[30px] max-sm:mb-6 font-bold text-[#23499b] text-center mb-10">JOIN SPRINGWAVE!</h1>

        <form id="register-form">
            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Full Name <span class="text-red-500">*</span>
                </label>
                <div class="flex gap-3.5 max-md:flex-col">
                    <input id="first-name" type="text" placeholder="First Name" required
                           class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
                    <input id="last-name" type="text" placeholder="Last Name" required
                           class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
                </div>
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Username <span class="text-red-500">*</span>
                </label>
                <input id="username" type="text" placeholder="AlbertEpstein" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Class <span class="text-red-500">*</span>
                </label>
                <input id="class" type="text" placeholder="Enter your class" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Email <span class="text-red-500">*</span>
                </label>
                <input id="email" type="email" placeholder="example@gmail.com" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Phone No. <span class="text-red-500">*</span>
                </label>
                <input id="tel" type="tel" placeholder="0123456789" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Date of Birth <span class="text-red-500">*</span>
                </label>
                <input id="dob" type="date" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    School <span class="text-red-500">*</span>
                </label>
                <input id="school" type="search" placeholder="Search your school" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Major <span class="text-red-500">*</span>
                </label>
                <input id="major" type="search" placeholder="Search your major" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-5">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Password <span class="text-red-500">*</span>
                </label>
                <input id="password" type="password" placeholder="Enter password" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div class="mb-2.5" id="last-form-group">
                <label class="block mb-2.5 font-semibold text-[#222] text-base">
                    Confirm Password <span class="text-red-500">*</span>
                </label>
                <input id="confirm-password" type="password" placeholder="Confirm password" required
                       class="w-full p-[11px_14px] border-2 border-[#23499b] rounded-xl outline-none text-sm bg-white transition duration-200 focus:border-[#183a82] focus:ring-4 focus:ring-[#23499b]/20 max-sm:text-base">
            </div>

            <div id="status-msg" class="text-sm my-2"></div>

            <button type="submit"
                    class="w-full p-4 bg-[#ffde42] border-2 border-[#23499b] rounded-2xl text-xl font-bold cursor-pointer mt-2.5 transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_8px_18px_rgba(255,222,66,0.4)] max-sm:p-3.5 max-sm:text-lg">
                REGISTER
            </button>

            <div class="mt-4 text-center text-[17px] text-[#333]">
                Already have an account?
                <a href="login.html" class="text-[#23499b] font-bold no-underline"><u>Login now</u></a>
            </div>
        </form>
    </div>

    <div id="chatbot-container"></div>
    <script type="module" src="js/pages/register.js"></script>
</body>

</html>
