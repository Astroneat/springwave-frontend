<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringWave - Register</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./js/tailwind-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components/register.css">
    <link rel="stylesheet" href="css/components/chatBot.css">
</head>

<body>

    <div class="frame-1">
        <h1 class="join-title">JOIN SPRINGWAVE!</h1>
        <form id="register-form">
            <!-- FULL NAME -->
            <div class="form-group">
                <label>
                    Full Name <span class="required">*</span>
                </label>

                <div class="name-row">
                    <input id="first-name" type="text" placeholder="First Name" required autocomplete>
                    <input id="last-name" type="text" placeholder="Last Name" required autocomplete>
                </div>
            </div>

            <!-- USERNAME -->
            <div class="form-group">
                <label>
                    Username <span class="required">*</span>
                </label>

                <input id="username" type="text" placeholder="AlbertEpstein" required autocomplete>
            </div>

            <!-- CLASS -->
            <div class="form-group">
                <label>
                    Class <span class="required">*</span>
                </label>

                <input id="class" type="text" placeholder="Enter your class" required autocomplete>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label>
                    Email <span class="required">*</span>
                </label>

                <input id="email" type="email" placeholder="example@gmail.com" required autocomplete>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label>
                    Phone No. <span class="required">*</span>
                </label>

                <input id="tel" type="tel" placeholder="0123456789" required autocomplete>
            </div>

            <!-- DATE OF BIRTH -->
            <div class="form-group">
                <label>
                    Date of Birth <span class="required">*</span>
                </label>

                <input id="dob" type="date" required autocomplete>
            </div>

            <!-- SCHOOL -->
            <div class="form-group">
                <label>
                    School <span class="required">*</span>
                </label>

                <input id="school" type="search" placeholder="Search your school" required autocomplete>
            </div>

            <!-- MAJOR -->
            <div class="form-group">
                <label>
                    Major <span class="required">*</span>
                </label>

                <input id="major" type="search" placeholder="Search your major" required autocomplete>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label>
                    Password <span class="required">*</span>
                </label>

                <input id="password" type="password" placeholder="Enter password" required autocomplete>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="form-group" id="last-form-group">
                <label>
                    Confirm Password <span class="required">*</span>
                </label>

                <input id="confirm-password" type="password" placeholder="Confirm password" required autocomplete>
            </div>

            <div id="status-msg" class="status-msg">
                <!-- aaa -->
            </div>

            <!-- REGISTER BUTTON -->
            <button type="submit" class="register-btn">
                REGISTER
            </button>

            <!-- LOGIN -->
            <div class="login-text">
                Already have an account?
                <a href="login.html"><u>Login now</u></a>
            </div>
        </form>
    </div>

    <div id="chatbot-container"></div>
    <script type="module" src="js/pages/register.js"></script>
</body>

</html>
