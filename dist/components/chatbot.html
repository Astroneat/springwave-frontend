<div class="chatbot-widget" id="chatbot-widget">
  <div class="chatbot-panel" id="chatbot-panel">
    <div class="chatbot-header">
      <div class="chatbot-header-info">
        <div class="chatbot-avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div>
          <div class="chatbot-title">SpringWave Assistant</div>
          <div class="chatbot-status">Online</div>
        </div>
      </div>
      <button class="chatbot-close" id="chatbot-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="chatbot-messages" id="chatbot-messages">
      <div class="message bot">
        <div class="message-content">
          Xin chào! Tôi là trợ lý SpringWave. Tôi có thể giúp gì cho bạn?
        </div>
      </div>
    </div>
    <div class="chatbot-input-area">
      <input type="text" class="chatbot-input" id="chatbot-input" placeholder="Nhập tin nhắn..." autocomplete="off" />
      <button class="chatbot-send" id="chatbot-send">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>
  <div class="chatbot-bubble" id="chatbot-bubble">
    <i class="fa-regular fa-comment-dots"></i>
  </div>
</div>
