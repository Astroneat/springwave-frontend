<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Organization Profile | SpringWave</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/assets/style.css" />
    <!-- Tailwind Theme Configuration -->
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .nav-scrolled {
            background: rgba(255, 255, 255, 0.9) !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .hover-lift {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hover-lift:hover {
            transform: translateY(-4px) scale(1.02);
        }
    </style>
</head>

<body class="bg-[#faf8ff] text-[#191b22] font-body-md antialiased overflow-x-hidden">
    <!-- NAVBAR -->
    <div id="navbar-container"></div>
    <main class="min-h-screen">
        <!-- Hero Section -->
        <section class="relative w-full">
            <div class="h-64 md:h-[400px] w-full relative overflow-hidden group">
                <div id="org-cover" class="w-full h-full bg-cover bg-center"
                    data-alt="A wide panoramic aerial view of a vibrant university campus during sunrise, with modern glass buildings reflecting soft golden light. The atmosphere is academic and innovative, featuring a color palette dominated by sophisticated royal blue and warm off-white tones, captured in a clean and high-fidelity architectural photography style."
                    style="background-color: #f1f5f9;"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                <!-- Cover Edit Button -->
                <button id="edit-cover-btn"
                    class="hidden absolute top-4 right-4 bg-black/60 hover:bg-black/80 text-white px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition-all duration-200 cursor-pointer z-10 md:opacity-0 group-hover:opacity-100">
                    <span class="material-symbols-outlined text-md">photo_camera</span>
                    <span>Edit Cover Photo</span>
                </button>
                <input type="file" id="cover-file-input" accept="image/*" class="hidden" />
            </div>
            <div class="max-w-[1200px] mx-auto px-8 relative">
                <div class="flex flex-col md:flex-row items-end gap-6 -mt-16 md:-mt-24">
                    <div class="relative group">
                        <div
                            class="w-32 h-32 md:w-48 md:h-48 rounded-full border-4 border-[#faf8ff] bg-white overflow-hidden shadow-xl relative">
                            <img id="org-avatar" class="w-full h-full object-cover"
                                data-alt="A professional circular logo for Google Developer Student Clubs, featuring the iconic minimalist Google colors of red, blue, yellow, and green arranged in a clean, geometric developer-centric emblem. The lighting is flat and modern, set against a pristine white background with a soft studio glow."
                                src="" />
                            <!-- Avatar Edit Overlay -->
                            <button id="edit-avatar-btn"
                                class="hidden absolute inset-0 bg-black/50 text-white flex flex-col items-center justify-center gap-1 transition-opacity duration-200 cursor-pointer md:opacity-0 group-hover:opacity-100">
                                <span class="material-symbols-outlined text-lg md:text-2xl">photo_camera</span>
                                <span class="text-[10px] md:text-xs font-semibold">Update Logo</span>
                            </button>
                            <input type="file" id="avatar-file-input" accept="image/*" class="hidden" />
                        </div>
                        <div
                            class="absolute bottom-2 right-2 w-6 h-6 md:w-8 md:h-8 bg-green-500 border-2 border-white rounded-full">
                        </div>
                    </div>
                    <div
                        class="flex-1 pb-4 flex flex-col md:flex-row justify-between items-start md:items-end w-full gap-4">
                        <div>
                            <h1 id="org-name" class="font-bold text-2xl md:text-[32px] text-[#191b22]">Organization Name
                            </h1>
                            <p class="font-semibold text-sm text-[#64748b] flex items-center gap-1">
                                <span class="material-symbols-outlined text-lg"
                                    style="font-variation-settings: 'FILL' 1;">verified</span>

                            </p>
                        </div>
                        <div class="flex gap-3">
                            <button class="follow-btn flex items-center gap-2 font-semibold text-sm bg-primary text-white px-8 py-3 rounded-full shadow-lg hover:shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all" data-following="false">
                                <span class="material-symbols-outlined text-md">add</span>
                                <span class="follow-label">Follow</span>
                            </button>
                            <button
                                class="material-symbols-outlined p-3 rounded-full border border-[#ecedfa] text-[#64748b] hover:bg-[#f8f9fc] transition-colors">share</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Content Grid -->
        <section class="max-w-[1200px] mx-auto px-8 py-16">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                <!-- Main Content (Left Column) -->
                <div class="lg:col-span-8 space-y-16">
                    <!-- About Section -->
                    <div class="bg-white border border-[#ecedfa] p-6 rounded-[24px] shadow-sm">
                        <h2 class="font-bold text-xl text-primary mb-4">About Organization</h2>
                        <p id="org-bio" class=" text-base text-[#64748b] mb-8 leading-relaxed">
                            Loading organization details...
                        </p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-xl bg-[#dae1ff]/20 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined">mail</span>
                                </div>
                                <div>
                                    <p class="font-semibold text-xs text-[#64748b]">Email Contact</p>
                                    <p id="org-email" class="font-semibold text-sm text-[#191b22]">-</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 rounded-xl bg-[#dae1ff]/20 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined">public</span>
                                </div>
                                <div>
                                    <p class="font-semibold text-xs text-[#64748b]">Chapter Website</p>
                                    <p id="org-website" class="font-semibold text-sm text-[#191b22]">-</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <p class="font-semibold text-sm text-[#191b22]">Connect with us:</p>
                            <div class="flex gap-2">
                                <a class="w-10 h-10 rounded-full flex items-center justify-center border border-[#ecedfa] text-[#64748b] hover:text-[#0077b5] hover:border-[#0077b5] transition-all" data-social="linkedin" href="#">
                                    <svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
                                        <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.761 0 5-2.239 5-5v-14c0-2.761-2.239-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path>
                                    </svg>
                                </a>
                                <a class="w-10 h-10 rounded-full flex items-center justify-center border border-[#ecedfa] text-[#64748b] hover:text-[#1877f2] hover:border-[#1877f2] transition-all" data-social="facebook" href="#">
                                    <svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
                                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
                                    </svg>
                                </a>
                                <a class="w-10 h-10 rounded-full flex items-center justify-center border border-[#ecedfa] text-[#64748b] hover:text-[#1da1f2] hover:border-[#1da1f2] transition-all" data-social="twitter" href="#">
                                    <svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
                                        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.84 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"></path>
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- Upcoming Events -->
                    <div id="events-section">
                        <div class="flex justify-between items-end mb-8">
                            <h2 class="font-bold text-xl text-[#191b22]">Upcoming Events</h2>
                            <a class="text-primary font-semibold text-sm flex items-center gap-1 hover:underline"
                                href="#">
                                View Calendar
                                <span class="material-symbols-outlined text-sm">arrow_forward</span>
                            </a>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="org-events-grid">
                            <!-- Events will be rendered here -->
                        </div>
                    </div>
                </div>
                <!-- Sidebar (Right Column) -->
                <aside class="lg:col-span-4 space-y-6">
                    <!-- Stats Card -->
                    <div
                        class="bg-white border border-[#ecedfa] p-6 rounded-[24px] shadow-sm border-l-4 border-l-primary">
                        <div class="space-y-6">
                            <div class="flex items-center justify-between">
                                <div class="flex flex-col">
                                    <span id="org-stats-events"
                                        class="font-display-lg text-[40px] text-primary">0</span>
                                    <span class="font-semibold text-sm text-[#64748b]">Events Hosted</span>
                                </div>
                                <div
                                    class="w-14 h-14 rounded-2xl bg-[#dae1ff]/20 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined text-3xl">event_available</span>
                                </div>
                            </div>
                            <div class="h-px bg-outline-variant/30 w-full"></div>
                            <div class="flex items-center justify-between">
                                <div class="flex flex-col">
                                    <span id="org-stats-followers"
                                        class="font-display-lg text-[40px] text-primary">0</span>
                                    <span class="font-semibold text-sm text-[#64748b]">Followers</span>
                                </div>
                                <div
                                    class="w-14 h-14 rounded-2xl bg-[#dae1ff]/20 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined text-3xl">group</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </main>
    <!-- FOOTER -->
    <div id="footer-container"></div>

    <div class="popup-overlay" id="popup-overlay" hidden>
        <div class="popup-backdrop"></div>
        <div class="popup-container" id="popup-container"></div>
    </div>
    <div id="chatbot-container"></div>
    <script type="module" src="./js/pages/org-profile.js"></script>
</body>

</html>
