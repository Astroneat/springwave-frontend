<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <title data-i18n="explore.title">Explore Activities - SpringWave</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>

<body class="bg-background text-on-surface font-body-md">

  <div id="navbar-container"></div>

  <!-- ===== EXPLORE SECTION ===== -->
  <section class="explore min-h-screen pt-24" id="explore">

    <!-- INTRO -->
    <div class="max-w-container-max mx-auto px-gutter">
      <div class="text-center mb-8 space-y-4 pt-8">
        <span
          class="inline-flex items-center gap-2 py-1.5 px-4 bg-primary-fixed text-on-primary-fixed-variant rounded-full font-label-md text-label-md">
          <span class="material-symbols-outlined text-lg">search</span>
          <span data-i18n="explore.discover_label">Discover Events</span>
        </span>
        <h1 class="font-headline-lg text-headline-lg" data-i18n="explore.find_adventure">Find Your Next Adventure</h1>
        <p class="font-body-md text-body-md text-on-surface-variant max-w-xl mx-auto" data-i18n="explore.explore_desc">Search through hundreds of
          activities and events happening around you.</p>
      </div>
    </div>

    <!-- RECOMMENDATIONS -->
    <div id="recommendations-section" class="max-w-container-max mx-auto px-gutter mb-6" style="display:none;">
      <div class="recommendations-header">
        <span class="material-symbols-outlined" style="color:#8B5CF6;font-size:22px;">auto_awesome</span>
        <h2 class="recommendations-title" data-i18n="explore.recommended">Recommended For You</h2>
      </div>
      <div id="recommendations-container" class="recommendations-container"></div>
    </div>

    <!-- SEARCH BAR -->
    <div id="searchBarPlaceholder">
      <div id="floating-search">
        <div class="search-bar glass-search">
          <div class="search-item">
            <label for="search-1" data-i18n="explore.where">Where</label>
            <input id="search-1" type="text" placeholder="Anywhere" data-i18n-placeholder="explore.anywhere" />
          </div>
          <div class="search-item search-item-date" id="searchDateItem">
            <label for="search-2" data-i18n="explore.when">When</label>
            <div class="dr-trigger" id="drTrigger">
              <span class="dr-placeholder" id="drPlaceholder" data-i18n="explore.anytime">Anytime</span>
              <span class="dr-value" id="drValue">dd/mm - dd/mm</span>
              <span class="dr-chevron">▾</span>
            </div>
            <div class="dr-dropdown" id="drDropdown" hidden>
              <div class="dr-cal-header">
                <button class="dr-nav" id="drPrev">‹</button>
                <span class="dr-month-label" id="drMonthLabel">Month Year</span>
                <button class="dr-nav" id="drNext">›</button>
              </div>
              <div class="dr-cal-grid" id="drCalGrid"></div>
              <div class="dr-cal-footer">
                <button class="dr-clear" id="drClear" data-i18n="explore.clear">Clear</button>
                <button class="dr-close" id="drClose" data-i18n="explore.close">Close</button>
              </div>
            </div>
          </div>
          <div class="search-item">
            <label for="search-3" data-i18n="explore.preferences">Preferences</label>
            <input id="search-3" type="text" placeholder="Anything you'd like" data-i18n-placeholder="explore.anything_you_like" />
          </div>
          <button class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span data-i18n="explore.search">Search</span>
          </button>
          <button class="refresh-btn" id="refresh-btn">
            <i class="fa-solid fa-rotate"></i>
          </button>
        </div>
      </div>

      <!-- SIDEBAR + CARDS -->
      <div class="mx-auto px-gutter mt-8" style="max-width:1480px;">
        <div class="explore-layout">

          <!-- LEFT SIDEBAR -->
          <aside class="explore-sidebar" id="exploreSidebar">
            <div class="sidebar-inner">
              <div class="sidebar-section">
                <h3 class="sidebar-title" data-i18n="explore.categories">Categories</h3>
                <div class="category-list" id="categoryList">
                  <button class="category-chip active" data-category="all" data-i18n="explore.all">All</button>
                  <button class="category-chip" data-category="sport" data-i18n="explore.sports">Sports</button>
                  <button class="category-chip" data-category="music" data-i18n="explore.music">Music</button>
                  <button class="category-chip" data-category="education" data-i18n="explore.education">Education</button>
                  <button class="category-chip" data-category="technology" data-i18n="explore.technology">Technology</button>
                  <button class="category-chip" data-category="volunteering" data-i18n="explore.volunteering">Volunteering</button>
                  <button class="category-chip" data-category="social" data-i18n="explore.social">Social</button>
                  <button class="category-chip" data-category="art" data-i18n="explore.arts">Arts</button>
                </div>
              </div>

              <div class="sidebar-section">
                <h3 class="sidebar-title" data-i18n="explore.sort_by">Sort By</h3>
                <div class="sort-list" id="sortList">
                  <label class="sort-option active" data-sort="newest">
                    <span class="sort-radio"></span>
                    <span data-i18n="explore.newest">Newest</span>
                  </label>
                  <label class="sort-option" data-sort="popular">
                    <span class="sort-radio"></span>
                    <span data-i18n="explore.most_popular">Most Popular</span>
                  </label>
                  <label class="sort-option" data-sort="ending">
                    <span class="sort-radio"></span>
                    <span data-i18n="explore.ending_soon">Ending Soon</span>
                  </label>
                </div>
              </div>

              <button class="clear-filters-btn" id="clearFilters">
                <span class="material-symbols-outlined text-lg">close</span>
                <span data-i18n="explore.clear_filters">Clear Filters</span>
              </button>
            </div>
          </aside>

          <!-- MAIN CONTENT -->
          <main class="explore-main">
            <div class="results-header">
              <span class="results-count" id="resultsCount">0 activities</span>
              <div class="sidebar-toggle" id="sidebarToggle">
                <span class="material-symbols-outlined">filter_list</span>
                <span data-i18n="explore.filters">Filters</span>
              </div>
            </div>
            <div id="cards-container" class="cards-container"></div>
          </main>

        </div>
      </div>
    </div>
  </section>

  <!-- POPUPS -->
  <div class="popup-overlay" id="popup-overlay" hidden>
    <div class="popup-backdrop"></div>
    <div class="popup-container" id="popup-container"></div>
  </div>

  <div class="popup-overlay" id="popup-overlay-2" hidden>
    <div class="popup-backdrop"></div>
    <div class="popup-container" id="popup-container-2"></div>
  </div>

  <!-- EXPLORE POST MODAL -->
  <div class="forum-post-overlay" id="explorePostOverlay" style="display: none;">
    <div class="forum-post-backdrop" id="explorePostBackdrop"></div>
    <div class="forum-post-modal" id="explorePostModal">
      <div class="forum-post-modal-header">
        <h2>Start a Discussion</h2>
        <button class="forum-post-modal-close" id="explorePostClose">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="forum-post-modal-body">
        <div class="forum-post-field">
          <label for="explorePostTitle">Title</label>
          <input type="text" id="explorePostTitle" placeholder="What's on your mind?" />
        </div>
        <div class="forum-post-field">
          <label for="explorePostContent">Content</label>
          <textarea id="explorePostContent" rows="6" placeholder="Share your thoughts, questions, or experiences..."></textarea>
        </div>
        <div class="forum-post-field">
          <label for="explorePostTags">Tags</label>
          <input type="text" id="explorePostTags" placeholder="e.g. AI, Hackathon, Team Building (comma separated)" />
        </div>
        <div class="forum-post-field">
          <label>Related Event</label>
          <div id="explorePostEventInfo" class="explore-post-event-info"></div>
        </div>
      </div>
      <div class="forum-post-modal-footer">
        <button class="forum-post-btn-cancel" id="explorePostCancel">Cancel</button>
        <button class="forum-post-btn-publish" id="explorePostPublish">
          <span class="material-symbols-outlined text-lg">publish</span>
          Publish
        </button>
      </div>
    </div>
  </div>

  <div id="chatbot-container"></div>

  <script type="module" src="js/pages/explore.js"></script>
</body>

</html>
