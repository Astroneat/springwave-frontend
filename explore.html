<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">

    <link rel="stylesheet" href="./css/components/navbar.css">
    <link rel="stylesheet" href="./css/components/explore.css">
    <link rel="stylesheet" href="./css/components/searchbar.css">
    <link rel="stylesheet" href="./css/components/cards.css">
    <link rel="stylesheet" href="./css/components/popup.css">
    <link rel="stylesheet" href="./css/components/description.css">
    <link rel="stylesheet" href="./css/components/chatbot.css">

    <style>
        #navLinks {
            transition: transform 0.45s cubic-bezier(.22,1,.36,1), opacity 0.35s ease, visibility 0.35s ease;
        }
        body.explore-merged #navLinks {
            transform: translateY(-120%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        body.explore-merged #navbar .floating-search-wrapper {
            position: static;
            padding: 0;
            margin: 0;
            width: auto;
            flex: 1;
            opacity: 1;
            pointer-events: auto;
            transform: none;
            left: auto;
            transition: none;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-bar {
            max-width: none;
            margin: 0;
            height: 44px;
            border-radius: 12px;
            padding: 0 4px;
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(255,255,255,0.6);
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item {
            padding: 0 10px;
            border-right: 1px solid rgba(0,0,0,0.06);
            border-radius: 0;
            cursor: pointer;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item:hover {
            background: rgba(0,0,0,0.03);
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item:first-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item label {
            display: none;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item input {
            font-size: 0.8rem;
            height: 32px;
            padding: 0 4px;
            background: transparent;
            border: none;
            outline: none;
            color: #222;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item input::placeholder {
            color: #888;
            font-weight: 400;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-item-date {
            min-width: 100px;
        }
        body.explore-merged #navbar .floating-search-wrapper .dr-trigger {
            font-size: 0.8rem;
            color: #444;
            font-weight: 500;
        }
        body.explore-merged #navbar .floating-search-wrapper .dr-placeholder {
            color: #888;
            font-weight: 400;
        }
        body.explore-merged #navbar .floating-search-wrapper .dr-value {
            color: #222;
            font-weight: 600;
        }
        body.explore-merged #navbar .floating-search-wrapper .dr-chevron {
            font-size: 8px;
            color: #999;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-btn {
            height: 34px;
            padding: 0 16px;
            font-size: 0.8rem;
            min-width: auto;
            margin: 0 4px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent, #1755ba), var(--accent-dim, #3b6fd4));
            color: white;
            border: none;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(23,85,186,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body.explore-merged #navbar .floating-search-wrapper .search-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 14px rgba(23,85,186,0.3);
        }
        body.explore-merged #navbar .floating-search-wrapper .search-btn:active {
            transform: scale(0.96);
        }
        body.explore-merged #navbar .floating-search-wrapper .refresh-btn {
            width: 34px;
            height: 34px;
            font-size: 12px;
        }

        .explore .floating-search-wrapper {
            position: sticky;
            top: 80px;
            z-index: 40;
            width: 100%;
            padding: 0 2rem;
            margin-bottom: 2rem;
            opacity: 1;
            pointer-events: auto;
            transform: none;
            left: auto;
        }
        .explore .search-bar {
            max-width: 1100px;
            margin: 0 auto;
        }
        .dr-dropdown {
            position: fixed !important;
            z-index: 99999 !important;
            width: 360px !important;
            border-radius: 20px !important;
        }
    </style>
</head>

<body class="bg-background text-on-surface font-body-md">

    <div id="navbar-container"></div>

    <!-- ===== EXPLORE SECTION ===== -->
    <section class="explore min-h-screen pt-24" id="explore">

      <!-- INTRO -->
      <div class="max-w-container-max mx-auto px-gutter">
        <div class="text-center mb-8 space-y-4 pt-8">
          <span class="inline-flex items-center gap-2 py-1.5 px-4 bg-primary-fixed text-on-primary-fixed-variant rounded-full font-label-md text-label-md">
            <span class="material-symbols-outlined text-lg">search</span>
            Discover Events
          </span>
          <h1 class="font-headline-lg text-headline-lg">Find Your Next Adventure</h1>
          <p class="font-body-md text-body-md text-on-surface-variant max-w-xl mx-auto">Search through hundreds of activities and events happening around you.</p>
        </div>
      </div>

      <!-- SEARCH BAR -->
      <div id="searchBarPlaceholder">
        <div class="floating-search-wrapper" id="floating-search">
          <div class="search-bar glass-search">
            <div class="search-item">
              <label for="search-1">Where</label>
              <input id="search-1" type="text" placeholder="Anywhere"/>
            </div>
            <div class="search-item search-item-date" id="searchDateItem">
              <label for="search-2">When</label>
              <div class="dr-trigger" id="drTrigger">
                <span class="dr-placeholder" id="drPlaceholder">Anytime</span>
                <span class="dr-value" id="drValue">dd/mm - dd/mm</span>
                <span class="dr-chevron">▾</span>
              </div>
              <div class="dr-dropdown" id="drDropdown">
                <div class="dr-cal-header">
                  <button class="dr-nav" id="drPrev">‹</button>
                  <span class="dr-month-label" id="drMonthLabel">Month Year</span>
                  <button class="dr-nav" id="drNext">›</button>
                </div>
                <div class="dr-cal-grid" id="drCalGrid"></div>
                <div class="dr-cal-footer">
                  <button class="dr-clear" id="drClear">Clear</button>
                  <button class="dr-close" id="drClose">Close</button>
                </div>
              </div>
            </div>
            <div class="search-item">
              <label for="search-3">Preferences</label>
              <input id="search-3" type="text" placeholder="Anything you'd like"/>
            </div>
            <button class="search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
              <span>Search</span>
            </button>
            <button class="refresh-btn" id="refresh-btn">
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- SIDEBAR + CARDS -->
      <div class="mx-auto px-gutter mt-8" style="max-width:1480px;">
        <div class="explore-layout">

          <!-- LEFT SIDEBAR -->
          <aside class="explore-sidebar" id="exploreSidebar">
            <div class="sidebar-inner">
              <div class="sidebar-section">
                <h3 class="sidebar-title">Categories</h3>
                <div class="category-list" id="categoryList">
                  <button class="category-chip active" data-category="all">All</button>
                  <button class="category-chip" data-category="sports">Sports</button>
                  <button class="category-chip" data-category="music">Music</button>
                  <button class="category-chip" data-category="education">Education</button>
                  <button class="category-chip" data-category="technology">Technology</button>
                  <button class="category-chip" data-category="volunteering">Volunteering</button>
                  <button class="category-chip" data-category="social">Social</button>
                  <button class="category-chip" data-category="arts">Arts</button>
                </div>
              </div>

              <div class="sidebar-section">
                <h3 class="sidebar-title">Sort By</h3>
                <div class="sort-list" id="sortList">
                  <label class="sort-option active" data-sort="newest">
                    <span class="sort-radio"></span>
                    <span>Newest</span>
                  </label>
                  <label class="sort-option" data-sort="popular">
                    <span class="sort-radio"></span>
                    <span>Most Popular</span>
                  </label>
                  <label class="sort-option" data-sort="ending">
                    <span class="sort-radio"></span>
                    <span>Ending Soon</span>
                  </label>
                </div>
              </div>

              <button class="clear-filters-btn" id="clearFilters">
                <span class="material-symbols-outlined text-lg">close</span>
                Clear Filters
              </button>
            </div>
          </aside>

          <!-- MAIN CONTENT -->
          <main class="explore-main">
            <div class="results-header">
              <span class="results-count" id="resultsCount">0 activities</span>
              <div class="sidebar-toggle" id="sidebarToggle">
                <span class="material-symbols-outlined">filter_list</span>
                Filters
              </div>
            </div>
            <div id="cards-container" class="cards-container"></div>
          </main>

        </div>
      </div>
    </section>

    <!-- POPUPS -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-backdrop"></div>
        <div class="popup-container" id="popup-container"></div>
    </div>

    <div class="popup-overlay" id="popup-overlay-2">
        <div class="popup-backdrop"></div>
        <div class="popup-container" id="popup-container-2"></div>
    </div>

    <div id="chatbot-container"></div>

    <script type="module" src="js/pages/explore.js"></script>
</body>

</html>
