<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <title data-i18n="explore.title">Explore Activities - SpringWave</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>

<body class="explore-page-container text-on-surface font-body-md">

  <div id="navbar-container"></div>

  <!-- ===== EXPLORE SECTION ===== -->
  <section class="explore min-h-screen pt-24" id="explore">

    <!-- INTRO -->
    <div class="max-w-container-max mx-auto px-gutter">
      <div class="text-center mb-8 space-y-2 pt-8">
        <h1 class="explore-figma-title" data-i18n="explore.find_adventure">Find your next journey</h1>
        <p class="explore-figma-desc" data-i18n="explore.explore_desc">Search through hundreds of activities and events happening around you.</p>
      </div>
    </div>

    <!-- RECOMMENDATIONS (DYNAMIC) -->
    <div id="recommendations-section" class="max-w-container-max mx-auto px-gutter mb-6" style="display:none;">
      <div class="recommendations-header">
        <span class="material-symbols-outlined" style="color:#8B5CF6;font-size:22px;">auto_awesome</span>
        <h2 class="recommendations-title" data-i18n="explore.recommended">Recommended For You</h2>
      </div>
      <div id="recommendations-container" class="recommendations-container"></div>
    </div>

    <!-- SEARCH BAR -->
    <div class="explore-search-wrapper">
      <div class="explore-search-bar">
        
        <!-- Location Zone -->
        <div class="search-field-zone" id="zone-location">
          <label for="search-location" data-i18n="explore.where">Where</label>
          <div class="input-with-icon">
            <input type="text" id="search-location" placeholder="Anywhere" data-i18n-placeholder="explore.anywhere" readonly />
            <span class="material-symbols-outlined map-trigger-icon" id="mapTrigger" title="Open Map Selector">map</span>
          </div>
        </div>

        <div class="search-zone-divider"></div>

        <!-- Date Zone -->
        <div class="search-field-zone" id="zone-date">
          <span class="zone-label" data-i18n="explore.when">When</span>
          <div class="dr-trigger" id="drTrigger">
            <span class="dr-placeholder" id="drPlaceholder" data-i18n="explore.anytime">Anytime</span>
            <span class="dr-value" id="drValue">dd/mm - dd/mm</span>
            <span class="dr-chevron">▾</span>
          </div>
          
          <!-- Date range calendar picker dropdown -->
          <div class="dr-dropdown" id="drDropdown" hidden>
            <div class="dr-cal-header">
              <button class="dr-nav" id="drPrev">‹</button>
              <span class="dr-month-label" id="drMonthLabel">Month Year</span>
              <button class="dr-nav" id="drNext">›</button>
            </div>
            <div class="dr-cal-grid" id="drCalGrid"></div>
            <div class="dr-cal-footer">
              <button class="dr-clear" id="drClear" data-i18n="explore.clear">Clear</button>
              <button class="dr-close" id="drClose" data-i18n="explore.close">Close</button>
            </div>
          </div>
        </div>

        <div class="search-zone-divider"></div>

        <!-- Preferences Zone -->
        <div class="search-field-zone" id="zone-pref">
          <label for="search-pref" data-i18n="explore.preferences">Preferences</label>
          <input type="text" id="search-pref" placeholder="Anything you'd like" data-i18n-placeholder="explore.anything_you_like" />
        </div>

        <!-- Search Execution Button -->
        <button class="search-cta-btn" id="searchExecuteBtn" title="Run Search">
          <span class="material-symbols-outlined">search</span>
        </button>

      </div>
    </div>

    <!-- SIDEBAR + CARDS -->
    <div class="mx-auto px-gutter mt-8" style="max-width:1480px;">
      <div class="explore-layout">

        <!-- LEFT SIDEBAR -->
        <aside class="explore-sidebar" id="exploreSidebar">
          <div class="explore-sidebar-inner">
            <div class="sidebar-section-figma">
              <h3 class="sidebar-title-figma" data-i18n="explore.categories">Categories</h3>
              <div class="category-list-figma" id="categoryList">
                <button class="category-chip-figma category-chip active" data-category="all" data-i18n="explore.all">All</button>
                <button class="category-chip-figma category-chip" data-category="sport" data-i18n="explore.sports">Sports</button>
                <button class="category-chip-figma category-chip" data-category="music" data-i18n="explore.music">Music</button>
                <button class="category-chip-figma category-chip" data-category="education" data-i18n="explore.education">Education</button>
                <button class="category-chip-figma category-chip" data-category="technology" data-i18n="explore.technology">Technology</button>
                <button class="category-chip-figma category-chip" data-category="volunteering" data-i18n="explore.volunteering">Volunteering</button>
                <button class="category-chip-figma category-chip" data-category="social" data-i18n="explore.social">Social</button>
                <button class="category-chip-figma category-chip" data-category="art" data-i18n="explore.arts">Arts</button>
                <button class="category-chip-figma category-chip" data-category="workshop" data-i18n="explore.workshop">Workshop</button>
                <button class="category-chip-figma category-chip" data-category="seminar" data-i18n="explore.seminar">Seminar</button>
              </div>
            </div>

            <div class="sidebar-section-figma">
              <h3 class="sidebar-title-figma" data-i18n="explore.sort_by">Sort By</h3>
              <div class="sort-list-figma" id="sortList">
                <label class="sort-option-figma sort-option active" data-sort="newest">
                  <span class="sort-radio-figma"></span>
                  <span data-i18n="explore.newest">Newest</span>
                </label>
                <label class="sort-option-figma sort-option" data-sort="popular">
                  <span class="sort-radio-figma"></span>
                  <span data-i18n="explore.most_popular">Most Popular</span>
                </label>
                <label class="sort-option-figma sort-option" data-sort="ending">
                  <span class="sort-radio-figma"></span>
                  <span data-i18n="explore.ending_soon">Ending Soon</span>
                </label>
              </div>
            </div>

            <button class="clear-filters-btn-figma" id="clearFilters">
              <span class="material-symbols-outlined text-lg">close</span>
              <span data-i18n="explore.clear_filters">Clear Filters</span>
            </button>
          </div>
        </aside>

          <!-- MAIN CONTENT -->
          <main class="explore-main">
            <div class="results-header">
              <span class="results-count" id="resultsCount">0 activities</span>
              <div class="sidebar-toggle" id="sidebarToggle">
                <span class="material-symbols-outlined">filter_list</span>
                <span data-i18n="explore.filters">Filters</span>
              </div>
            </div>
            <div id="cards-container" class="cards-container"></div>
          </main>

        </div>
      </div>
    </div>
  </section>

  <!-- POPUPS -->
  <div class="popup-overlay" id="popup-overlay" hidden>
    <div class="popup-backdrop"></div>
    <div class="popup-container" id="popup-container"></div>
  </div>

  <div class="popup-overlay" id="popup-overlay-2" hidden>
    <div class="popup-backdrop"></div>
    <div class="popup-container" id="popup-container-2"></div>
  </div>

  <!-- EXPLORE POST MODAL -->
  <div class="forum-post-overlay" id="explorePostOverlay" style="display: none;">
    <div class="forum-post-backdrop" id="explorePostBackdrop"></div>
    <div class="forum-post-modal" id="explorePostModal">
      <div class="forum-post-modal-header">
        <h2>Start a Discussion</h2>
        <button class="forum-post-modal-close" id="explorePostClose">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="forum-post-modal-body">
        <div class="forum-post-field">
          <label for="explorePostTitle">Title</label>
          <input type="text" id="explorePostTitle" placeholder="What's on your mind?" />
        </div>
        <div class="forum-post-field">
          <label for="explorePostContent">Content</label>
          <textarea id="explorePostContent" rows="6" placeholder="Share your thoughts, questions, or experiences..."></textarea>
        </div>
        <div class="forum-post-field">
          <label for="explorePostTags">Tags</label>
          <input type="text" id="explorePostTags" placeholder="e.g. AI, Hackathon, Team Building (comma separated)" />
        </div>
        <div class="forum-post-field">
          <label>Related Event</label>
          <div id="explorePostEventInfo" class="explore-post-event-info"></div>
        </div>
      </div>
      <div class="forum-post-modal-footer">
        <button class="forum-post-btn-cancel" id="explorePostCancel">Cancel</button>
        <button class="forum-post-btn-publish" id="explorePostPublish">
          <span class="material-symbols-outlined text-lg">publish</span>
          Publish
        </button>
      </div>
    </div>
  </div>

  <!-- MAP SELECTOR MODAL -->
  <div class="map-modal-overlay" id="mapModalOverlay" hidden>
    <div class="map-modal-backdrop" id="mapModalBackdrop"></div>
    <div class="map-modal-container">
      <div class="map-modal-header">
        <h3 data-i18n="explore.select_location_title">Select Location</h3>
        <button class="map-modal-close" id="mapModalClose">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="map-modal-body">
        <div class="map-search-bar">
          <input type="text" id="mapSearchInput" placeholder="Search location name (e.g. Da Nang)..." />
          <button id="mapSearchBtn">
            <span class="material-symbols-outlined">search</span>
          </button>
        </div>
        <div id="leafletMap" class="leaflet-map-element"></div>
        <div class="map-selected-address">
          <strong>Selected Address:</strong>
          <span id="selectedAddressText">None</span>
        </div>
      </div>
      <div class="map-modal-footer">
        <button class="map-btn-cancel" id="mapCancelBtn">Cancel</button>
        <button class="map-btn-confirm" id="mapConfirmBtn">Confirm Location</button>
      </div>
    </div>
  </div>

  <div id="chatbot-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/pages/explore.js"></script>
</body>

</html>
